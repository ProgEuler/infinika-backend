version: '3.8'

services:
  db:
    image: postgres:15
    container_name: study_pulse_db
    restart: always
    env_file:
      - project_root/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      # Lets `web` wait until Postgres accepts connections before migrating.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: study_pulse_web
    restart: always
    command: bash -c "python manage.py collectstatic --noinput && python manage.py ensure_db_schema && python manage.py migrate && gunicorn project_root.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./project_root/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
